<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Healthcare Management System - academic demonstration project">
  <title>Register | Smart Healthcare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar is created by js/app.js -->
  <div id="navbar"></div>

  <section class="section">
    <div class="container">
      <div class="card form-card">
        <h1 class="section-title">Create your patient account</h1>
        <p class="section-sub">Only basic details are collected.</p>

        <div class="alert alert-warning">Demonstration project: data stays in this browser only. Please do not enter real sensitive information or a password you use elsewhere.</div>
        <div id="formMessage" class="hidden" role="alert"></div>

        <form id="registerForm" novalidate>
          <div class="form-grid">
            <div class="field full">
              <label for="fullName">Full name</label>
              <input type="text" id="fullName" autocomplete="name">
              <small class="field-error" id="err-fullName"></small>
            </div>
            <div class="field">
              <label for="age">Age</label>
              <input type="number" id="age" min="1" max="120">
              <small class="field-error" id="err-age"></small>
            </div>
            <div class="field">
              <label for="gender">Gender</label>
              <select id="gender">
                <option value="">Select gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
              <small class="field-error" id="err-gender"></small>
            </div>
            <div class="field">
              <label for="phone">Phone number</label>
              <input type="tel" id="phone" placeholder="10 digits" autocomplete="tel">
              <small class="field-error" id="err-phone"></small>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" autocomplete="email">
              <small class="field-error" id="err-email"></small>
            </div>
            <div class="field full">
              <label for="password">Password</label>
              <input type="password" id="password" autocomplete="new-password">
              <small class="field-error" id="err-password"></small>
            </div>
            <div class="field full">
              <label for="address">Address</label>
              <textarea id="address" autocomplete="street-address"></textarea>
              <small class="field-error" id="err-address"></small>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <div id="goLogin" class="hidden" style="margin-top:16px">
          <a class="btn btn-green btn-block" href="login.html">Go to Login</a>
        </div>
        <p class="text-muted" style="margin-top:16px">Already registered? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </section>

  <!-- Footer is created by js/app.js -->
  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Healthcare Management System - academic demonstration project">
  <title>My Appointments | Smart Healthcare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar is created by js/app.js -->
  <div id="navbar"></div>

  <header class="page-head">
    <div class="container">
      <h1>My appointments</h1>
      <p>View details or cancel upcoming appointments.</p>
    </div>
  </header>

  <section class="section" style="padding-top:24px">
    <div class="container">
      <div id="pageMessage" class="hidden" role="alert"></div>

      <div class="toolbar">
        <input type="search" id="appointmentSearch" placeholder="Search by ID, doctor, specialization or reason" aria-label="Search appointments">
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option>Confirmed</option>
          <option>Completed</option>
          <option>Cancelled</option>
        </select>
        <a class="btn btn-primary" href="appointment.html">Book New</a>
      </div>

      <div id="appointmentList" class="appt-list"></div>
    </div>
  </section>

  <!-- Details pop-up -->
  <div class="modal-backdrop" id="detailsModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle">Appointment details</h3>
        <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
      </div>
      <div id="modalBody"></div>
      <button class="btn btn-outline btn-block" style="margin-top:16px" onclick="closeModal()">Close</button>
    </div>
  </div>

  <!-- Footer is created by js/app.js -->
  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script src="js/appointments.js"></script>
</body>
</html>

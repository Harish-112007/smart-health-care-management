<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Healthcare Management System - academic demonstration project">
  <title>Login | Smart Healthcare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar is created by js/app.js -->
  <div id="navbar"></div>

  <section class="section">
    <div class="container">
      <div class="card form-card" style="max-width:460px">
        <h1 class="section-title">Patient login</h1>
        <p class="section-sub">Log in to book and manage appointments.</p>

        <div id="formMessage" class="hidden" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email">
            <small class="field-error" id="err-email"></small>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password">
            <small class="field-error" id="err-password"></small>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="text-muted" style="margin-top:16px">New here? <a href="register.html">Create an account</a></p>
        <p class="text-muted" style="margin-top:8px;font-size:.85rem">Demonstration system. Do not use real sensitive information.</p>
      </div>
    </div>
  </section>

  <!-- Footer is created by js/app.js -->
  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

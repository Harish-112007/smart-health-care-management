<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Healthcare Management System - academic demonstration project">
  <title>Medicines | Smart Healthcare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar is created by js/app.js -->
  <div id="navbar"></div>

  <header class="page-head">
    <div class="container">
      <h1>Medicine information</h1>
      <p>Search a medicine by name to read general information.</p>
    </div>
  </header>

  <section class="section" style="padding-top:24px">
    <div class="container">
      <div class="alert alert-warning">Medicine information provided here is for general educational purposes only. Do not start, stop, or change medication without consulting a qualified healthcare professional.</div>

      <form class="toolbar" id="medicineForm">
        <input type="search" id="medicineSearch" placeholder="Search medicine name, e.g. Paracetamol" aria-label="Search medicine">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
      </form>

      <div id="medicineResults" class="grid grid-3"></div>
    </div>
  </section>

  <!-- Footer is created by js/app.js -->
  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script src="js/medicines.js"></script>
</body>
</html>
